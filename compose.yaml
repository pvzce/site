services:
  backend:
    image: pvzce-site:${VERSION:-local}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      casdoor:
        condition: service_healthy
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-1048576}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-pvzce}
      DB_USER: ${DB_USER:-pvzce}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-1}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5s}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-3s}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-5m}
      DATA_DIR: /data
      CONFIG_DIR: /configs
      CACHE_DIR: /cache
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-16777216}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      CASDOOR_ISSUER_URL: ${CASDOOR_ISSUER_URL:-http://localhost:8000}
      CASDOOR_INTERNAL_URL: http://casdoor:8000
      CASDOOR_APPLICATION: ${CASDOOR_APPLICATION:-pvzce-site}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-pvzce-site}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:?Run make auth-init first}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-24h}
    volumes:
      - type: bind
        source: ${DATA_DIR:-${FILE_ROOT:-./data}}
        target: /data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONFIG_DIR:-./configs}
        target: /configs
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /cache:rw,noexec,nosuid,nodev,size=64m,mode=0750,uid=65532,gid=65532
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pvzce}
      POSTGRES_USER: ${DB_USER:-pvzce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  casdoor:
    image: casbin/casdoor:4.18.0
    command: ["-createDatabase=true"]
    user: "${CASDOOR_UID:-1000}:${CASDOOR_GID:-1000}"
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${HOST:-127.0.0.1}:${CASDOOR_PORT:-8000}:8000"
    volumes:
      - type: bind
        source: ./configs/casdoor/app.conf
        target: /conf/app.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./configs/casdoor/init_data.json
        target: /conf/init_data.json
        read_only: true
        bind:
          create_host_path: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/.well-known/${CASDOOR_APPLICATION:-pvzce-site}/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
